<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)">

  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/favicon.svg' | relative_url }}">

  <!-- No webfonts: the stylesheet uses the system UI stack (SF Pro on Apple devices) -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Set the theme before first paint so there is no flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pl-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Use Jekyll SEO plugin (renders <title> and meta tags) -->
  {% seo %}

</head>
