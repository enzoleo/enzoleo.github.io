# Site Build Settings

# Build settings
markdown: kramdown
highlighter: rouge
permalink: none
plugins: [jekyll-sitemap, jekyll-seo-tag]

sass:
  sass_dir: assets/css
  style: :nested

kramdown:
  auto_ids: true

# Site metadata (used by jekyll-seo-tag and the page shell)
title: "Peiyu Liao"
description: "Electronic Design Automation · physical design, placement and routing"
author: "Peiyu Liao"
url: "https://enzoleo.github.io"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.md
  - node_modules
  - vendor/
  - assets/gen-favicon
