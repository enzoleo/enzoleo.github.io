<!doctype html>
<html lang="en">
{% include head.html %}

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include nav.html %}

  <main id="main">
    {% if page.hero != false %}{% include hero.html %}{% endif %}

    <div class="container content">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <button class="to-top" type="button" data-to-top aria-label="Back to top" hidden>
    {% include icon.html name='arrow-up' %}
  </button>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
